name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        # The commonly used android-actions/setup-android action also
        # tries to install a legacy "tools" package that Google removed
        # from the SDK repo years ago, which makes it fail outright - so
        # this installs directly instead of relying on that action.
        # Runner images vary in whether/where cmdline-tools are
        # preinstalled, so fall back to downloading them fresh if an
        # existing sdkmanager isn't found.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "Using SDK root: $SDK_ROOT"
          ls -la "$SDK_ROOT" 2>/dev/null || echo "(SDK root does not exist yet)"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -iname sdkmanager -type f 2>/dev/null | sort -V | tail -1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "No existing sdkmanager found, downloading cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager at: $SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK (build artifact, zipped)
        uses: actions/upload-artifact@v4
        with:
          name: budget-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a rolling release (direct, unzipped download link)
        # Build artifacts (above) always get zipped by GitHub with no way
        # around it. A release attachment downloads as the raw file
        # instead, so this keeps one rolling "latest-debug" release
        # updated with the newest APK on every push to main, giving a
        # stable, direct, non-zip download link.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          body: Automatically updated on every push to main. Commit ${{ github.sha }}.
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
